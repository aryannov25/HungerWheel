[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# API proxy → Netlify Functions
[[redirects]]
  from = "/gapi/*"
  to = "/.netlify/functions/gapi/:splat"
  status = 200

[[redirects]]
  from = "/photo"
  to = "/.netlify/functions/photo"
  status = 200

# SPA fallback — must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
